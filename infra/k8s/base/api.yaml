apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentiq-api
  namespace: incidentiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incidentiq-api
  template:
    metadata:
      labels:
        app: incidentiq-api
    spec:
      containers:
        - name: api
          image: incidentiq/api:dev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: incidentiq-config
            - secretRef:
                name: incidentiq-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: incidentiq-api
  namespace: incidentiq
spec:
  selector:
    app: incidentiq-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
